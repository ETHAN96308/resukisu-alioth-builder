# =============================================================================
#  GitHub Actions CI: ReSukiSU + SUSFS Kernel Builder
#  Device: Xiaomi Mi 11X / POCO F3 / Redmi K40 (alioth/aliothin)
#  ROM:    MIUI OS1.0.4.0.TKHINXM | Android 13 | Kernel 4.19 (Non-GKI)
#
#  HOW TO USE:
#    1. Push this repo to GitHub
#    2. Go to Actions tab → "Build ReSukiSU Kernel" → Run workflow
#    3. Wait ~30-45 min
#    4. Download the flashable zip from Artifacts
# =============================================================================

name: Build ReSukiSU + SUSFS Kernel for alioth

on:
  workflow_dispatch:
    inputs:
      kernel_repo:
        description: 'Kernel source repository'
        required: true
        default: 'ArrowOS-MiPa-Edition/android_kernel_xiaomi_alioth'
        type: string
      kernel_branch:
        description: 'Kernel source branch'
        required: true
        default: 'arrow-13.1'
        type: string
      ksu_repo:
        description: 'ReSukiSU repository'
        required: true
        default: 'rsuntk/KernelSU'
        type: string
      ksu_branch:
        description: 'ReSukiSU branch'
        required: true
        default: 'main'
        type: string
      susfs_branch:
        description: 'SUSFS branch (match kernel version)'
        required: true
        default: 'kernel-4.19'
        type: string
      defconfig:
        description: 'Kernel defconfig name'
        required: true
        default: 'alioth_defconfig'
        type: string

jobs:
  build:
    name: Build Kernel
    runs-on: ubuntu-22.04
    timeout-minutes: 120

    steps:
      # ========================================
      #  SETUP ENVIRONMENT
      # ========================================
      - name: Checkout this repo
        uses: actions/checkout@v4

      - name: Free disk space
        run: |
          echo ":: Freeing disk space..."
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/boost
          sudo apt-get clean
          df -h /

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            bc bison build-essential ccache curl flex \
            g++-multilib gcc-multilib git gnupg gperf \
            libelf-dev lz4 libncurses5-dev libssl-dev \
            lzop zip zlib1g-dev python3 cpio kmod

      - name: Setup ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          max-size: 4G
          key: alioth-4.19-${{ github.run_id }}
          restore-keys: alioth-4.19-

      # ========================================
      #  CLONE TOOLCHAIN
      # ========================================
      - name: Clone Proton Clang toolchain
        run: |
          echo ":: Cloning Proton Clang..."
          git clone --depth=1 https://github.com/kdrag0n/proton-clang.git $HOME/proton-clang
          echo "$HOME/proton-clang/bin" >> $GITHUB_PATH
          $HOME/proton-clang/bin/clang --version | head -1

      # ========================================
      #  CLONE KERNEL SOURCE
      # ========================================
      - name: Clone kernel source
        run: |
          echo ":: Cloning kernel source: ${{ inputs.kernel_repo }} (${{ inputs.kernel_branch }})"
          git clone --depth=1 \
            https://github.com/${{ inputs.kernel_repo }}.git \
            -b ${{ inputs.kernel_branch }} \
            $HOME/kernel

      - name: Verify defconfig exists
        run: |
          cd $HOME/kernel
          DEFCONFIG="${{ inputs.defconfig }}"
          
          if [ -f "arch/arm64/configs/$DEFCONFIG" ]; then
            echo "✓ Found defconfig: $DEFCONFIG"
          else
            echo "✗ Defconfig '$DEFCONFIG' not found!"
            echo ""
            echo "Available defconfigs:"
            ls arch/arm64/configs/ | grep -i -E "alioth|kona|vendor" || ls arch/arm64/configs/
            echo ""
            echo "Please re-run the workflow with the correct defconfig name."
            exit 1
          fi

      # ========================================
      #  INTEGRATE ReSukiSU
      # ========================================
      - name: Integrate ReSukiSU (rsuntk/KernelSU)
        run: |
          cd $HOME/kernel
          echo ":: Integrating ReSukiSU from ${{ inputs.ksu_repo }}..."
          curl -LSs "https://raw.githubusercontent.com/${{ inputs.ksu_repo }}/${{ inputs.ksu_branch }}/kernel/setup.sh" | bash -s ${{ inputs.ksu_branch }}
          
          # Add SUSFS files directly without breaking mainline patches
          git clone https://gitlab.com/simonpunk/susfs4ksu.git -b kernel-4.19 $HOME/susfs4ksu
          cp -v $HOME/susfs4ksu/kernel_patches/fs/susfs.c fs/susfs.c || cp -v $(find $HOME/susfs4ksu -name "susfs.c") fs/susfs.c || true
          cp -v $HOME/susfs4ksu/kernel_patches/include/linux/susfs.h include/linux/susfs.h || cp -v $(find $HOME/susfs4ksu -name "susfs.h") include/linux/susfs.h || true
          
          # Add susfs.o to fs/Makefile cleanly
          if ! grep -q "CONFIG_KSU_SUSFS" fs/Makefile; then
            echo 'obj-$(CONFIG_KSU_SUSFS) += susfs.o' >> fs/Makefile
          fi

      # ========================================
      #  CONFIGURE KERNEL
      # ========================================
      - name: Configure kernel
        run: |
          cd $HOME/kernel
          
          export CLANG_TRIPLE=aarch64-linux-gnu-
          export CROSS_COMPILE=aarch64-linux-gnu-
          export CROSS_COMPILE_ARM32=arm-linux-gnueabi-
          
          echo ":: Generating defconfig: ${{ inputs.defconfig }}..."
          make O=out \
            ARCH=arm64 \
            CC=clang \
            CLANG_TRIPLE=$CLANG_TRIPLE \
            CROSS_COMPILE=$CROSS_COMPILE \
            ${{ inputs.defconfig }}
          
          echo ":: Enabling KernelSU + SUSFS config flags..."
          cat >> out/.config << 'EOF'
          
          # Enable Backlight class device required by techpack display
          CONFIG_BACKLIGHT_CLASS_DEVICE=y
          CONFIG_BACKLIGHT_GENERIC=y
          CONFIG_BACKLIGHT_QCOM_WLED=y

          # KernelSU (ReSukiSU)
          CONFIG_KSU=y
          CONFIG_KSU_DEBUG=n
          
          # KProbes
          CONFIG_KPROBES=y
          CONFIG_HAVE_KPROBES=y
          CONFIG_KPROBE_EVENTS=y
          
          # SUSFS
          CONFIG_KSU_SUSFS=y
          CONFIG_KSU_SUSFS_SUS_PATH=y
          CONFIG_KSU_SUSFS_SUS_MOUNT=y
          CONFIG_KSU_SUSFS_TRY_UMOUNT=y
          CONFIG_KSU_SUSFS_SPOOF_UNAME=y
          CONFIG_KSU_SUSFS_ENABLE_LOG=y
          CONFIG_KSU_SUSFS_OPEN_REDIRECT=y
          CONFIG_KSU_SUSFS_SUS_SU=n
          EOF
          
          # Clean up indentation from heredoc
          sed -i 's/^          //' out/.config
          
          make O=out \
            ARCH=arm64 \
            CC=clang \
            CLANG_TRIPLE=$CLANG_TRIPLE \
            CROSS_COMPILE=$CROSS_COMPILE \
            olddefconfig
          
          # Verify
          grep "CONFIG_KSU" out/.config || echo "⚠ KSU config not found"
          grep "CONFIG_KSU_SUSFS" out/.config || echo "⚠ SUSFS config not found"

      # ========================================
      #  BUILD KERNEL
      # ========================================
      - name: Build kernel
        run: |
          cd $HOME/kernel
          
          export CLANG_TRIPLE=aarch64-linux-gnu-
          export CROSS_COMPILE=aarch64-linux-gnu-
          export CROSS_COMPILE_ARM32=arm-linux-gnueabi-
          
          echo ":: Building kernel (this takes 20-40 minutes)..."
          START=$(date +%s)
          
          make O=out \
            ARCH=arm64 \
            CC="ccache clang" \
            CXX="ccache clang++" \
            AR=llvm-ar \
            NM=llvm-nm \
            OBJCOPY=llvm-objcopy \
            OBJDUMP=llvm-objdump \
            STRIP=llvm-strip \
            CLANG_TRIPLE=$CLANG_TRIPLE \
            CROSS_COMPILE=$CROSS_COMPILE \
            CROSS_COMPILE_ARM32=$CROSS_COMPILE_ARM32 \
            LOCALVERSION="-ReSukiSU-SUSFS" \
            -j$(nproc --all) Image.gz-dtb dtbo.img || make O=out \
            ARCH=arm64 \
            CC="ccache clang" \
            CXX="ccache clang++" \
            AR=llvm-ar \
            NM=llvm-nm \
            OBJCOPY=llvm-objcopy \
            OBJDUMP=llvm-objdump \
            STRIP=llvm-strip \
            CLANG_TRIPLE=$CLANG_TRIPLE \
            CROSS_COMPILE=$CROSS_COMPILE \
            CROSS_COMPILE_ARM32=$CROSS_COMPILE_ARM32 \
            LOCALVERSION="-ReSukiSU-SUSFS" \
            -j$(nproc --all) Image
          
          END=$(date +%s)
          echo ":: Build took $(( END - START )) seconds"
          
          # Check for output
          if [ -f "out/arch/arm64/boot/Image" ]; then
            echo "✓ Kernel Image built!"
            ls -la out/arch/arm64/boot/Image*
          elif [ -f "out/arch/arm64/boot/Image.gz" ]; then
            echo "✓ Kernel Image.gz built!"
          elif [ -f "out/arch/arm64/boot/Image.gz-dtb" ]; then
            echo "✓ Kernel Image.gz-dtb built!"
          else
            echo "✗ BUILD FAILED - no kernel image found"
            exit 1
          fi

      # ========================================
      #  PACKAGE ANYKERNEL3
      # ========================================
      - name: Package AnyKernel3 zip
        run: |
          echo ":: Packaging with AnyKernel3..."
          
          git clone --depth=1 https://github.com/osm0sis/AnyKernel3.git $HOME/AnyKernel3
          cd $HOME/AnyKernel3
          
          # Clean example files
          rm -rf modules patch ramdisk README.md
          
          # Write alioth config
          cat > anykernel.sh << 'AK3EOF'
          # AnyKernel3 Ramdisk Mod Script
          # ReSukiSU + SUSFS for Xiaomi Mi 11X / POCO F3 (alioth)
          
          properties() { '
          kernel.string=ReSukiSU + SUSFS Kernel for alioth
          do.devicecheck=1
          do.modules=0
          do.systemless=1
          do.cleanup=1
          do.cleanuponabort=0
          device.name1=alioth
          device.name2=aliothin
          device.name3=POCO F3
          device.name4=Mi 11X
          supported.versions=13
          supported.patchlevels=
          '; }
          
          block=auto;
          is_slot_device=1;
          ramdisk_compression=auto;
          patch_vbmeta_flag=auto;
          
          . tools/ak3-core.sh;
          
          dump_boot;
          write_boot;
          AK3EOF
          
          # Fix indentation
          sed -i 's/^          //' anykernel.sh
          
          # Copy kernel image
          KERNEL_IMG=""
          for img in Image.gz-dtb Image.gz Image; do
            if [ -f "$HOME/kernel/out/arch/arm64/boot/$img" ]; then
              KERNEL_IMG="$HOME/kernel/out/arch/arm64/boot/$img"
              break
            fi
          done
          
          if [ -n "$KERNEL_IMG" ]; then
            cp -v "$KERNEL_IMG" ./
            echo "✓ Copied $(basename $KERNEL_IMG)"
          else
            echo "✗ No kernel image found!"
            exit 1
          fi
          
          # Copy DTB/DTBO if available
          [ -f "$HOME/kernel/out/arch/arm64/boot/dtb.img" ] && cp -v "$HOME/kernel/out/arch/arm64/boot/dtb.img" ./
          [ -f "$HOME/kernel/out/arch/arm64/boot/dtbo.img" ] && cp -v "$HOME/kernel/out/arch/arm64/boot/dtbo.img" ./
          
          # Create zip
          ZIP_NAME="ReSukiSU-SUSFS-alioth-$(date +%Y%m%d-%H%M).zip"
          zip -r9 "$HOME/$ZIP_NAME" . -x '*.git*' -x '*README*'
          
          echo "✓ Created: $ZIP_NAME ($(du -sh $HOME/$ZIP_NAME | cut -f1))"
          echo "ZIP_NAME=$ZIP_NAME" >> $GITHUB_ENV
          echo "ZIP_PATH=$HOME/$ZIP_NAME" >> $GITHUB_ENV

      # ========================================
      #  UPLOAD ARTIFACT
      # ========================================
      - name: Upload flashable zip
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ZIP_NAME }}
          path: ${{ env.ZIP_PATH }}
          retention-days: 30

      - name: Build summary
        run: |
          echo "## ✅ Build Complete!" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Component | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|" >> $GITHUB_STEP_SUMMARY
          echo "| **Device** | Mi 11X / POCO F3 (alioth) |" >> $GITHUB_STEP_SUMMARY
          echo "| **Kernel** | 4.19.x (non-GKI) |" >> $GITHUB_STEP_SUMMARY
          echo "| **Root** | ReSukiSU (${{ inputs.ksu_repo }}) |" >> $GITHUB_STEP_SUMMARY
          echo "| **SUSFS** | simonpunk/susfs4ksu (${{ inputs.susfs_branch }}) |" >> $GITHUB_STEP_SUMMARY
          echo "| **Output** | ${{ env.ZIP_NAME }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 📱 Flashing Instructions" >> $GITHUB_STEP_SUMMARY
          echo "1. Download the zip from Artifacts above" >> $GITHUB_STEP_SUMMARY
          echo "2. Copy to phone → Boot to TWRP → Flash → Reboot" >> $GITHUB_STEP_SUMMARY
          echo "3. Install ReSukiSU Manager v3.0.1 APK from \`https://github.com/rsuntk/KernelSU/releases\`" >> $GITHUB_STEP_SUMMARY
          echo "4. Install SUSFS module from \`https://github.com/sidex15/susfs4ksu-module/releases\`" >> $GITHUB_STEP_SUMMARY
